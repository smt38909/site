# =============================================================================
# Renders the Quarto site and publishes it to GitHub Pages.
#
# This runs on GitHub's computers, not yours. Every time anything is pushed to
# the main branch — including an edit Richa makes in the browser — GitHub
# rebuilds the site and puts the result live. Nobody has to run anything.
#
# PREREQUISITE (learned the hard way, 28 Aug 2026): this Action cannot create the
# gh-pages branch. `quarto publish gh-pages` refuses to run unless that branch
# already exists on the remote, and exits in ~17s with:
#   "the remote origin does not have a branch named gh-pages"
# It was created once by running `quarto publish gh-pages` locally. If the repo is
# ever recreated from scratch, do that once by hand before expecting this to work.
#
# You should not need to edit this file.
# =============================================================================

on:
  # Rebuild whenever anything lands on main
  push:
    branches: main
  # ...and allow a manual rebuild from the Actions tab if ever needed
  workflow_dispatch:

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
