# ============================================================================
# Quarto project configuration — the whole site is wired together here.
# Design: "Ledger" (direction B), see planning/design-directions-v1.html.
# ============================================================================

project:
  type: website
  output-dir: _site        # rendered HTML lands here; git-ignored (never edited by hand)

  # ===================== WHAT GETS PUBLISHED =====================
  # LIVE since 30 Aug 2026, as a SINGLE PAGE. Only index.qmd is built.
  #
  # research.qmd and teaching.qmd are NOT ready and are NOT rendered. The
  # `resources: "!*.qmd"` line below is what keeps their source out of the
  # published site as well — without it Quarto copies unrendered .qmd files
  # across as project resources and the unfinished pages become readable in
  # public. It is load-bearing. Do not remove it.
  #
  # TO ADD A PAGE when it is ready: add it to the render list AND uncomment its
  # entry in the navbar below. Both — a page with no navbar entry is unreachable,
  # a navbar entry with no page is a 404.
  #
  # TO GO BACK TO THE HOLDING PAGE: change the render list to `- holding.qmd`.
  # holding.qmd is untouched in this folder and carries its own noindex tag.
  render:
    - index.qmd
  resources:
    - "!*.qmd"
  # ===============================================================

website:
  title: "Dr. Richa Singh"
  # The RS monogram. `favicon` replaces the browser's default globe in the tab;
  # `navbar: logo:` puts the same mark to the left of her name. Both files live
  # in images/ and are published as page resources. The uncropped original is
  # kept out of the public repo, in private/rs-icon-master.png.
  favicon: images/rs-icon-32.png
  # site-url is REQUIRED for Google Scholar tags to build correctly (Plan §5, §Phase-4).
  # Domain registered 2026-08-27.
  site-url: "https://drrichasingh.in"

  navbar:
    logo: images/rs-icon-180.png
    logo-alt: "Dr. Richa Singh"
    # Three short tabs fit comfortably on a tablet — only phones need the
    # hamburger. Default is 'lg' (992px), which hides the tabs on an iPad.
    collapse-below: md
    # No tabs while the site is a single page (30 Aug 2026): two tabs leading
    # to pages that do not exist would 404, and one lone "Profile" tab beside
    # the name is redundant. The navbar shows her name and the search box.
    # Uncomment an entry here at the same time as adding its page to the render
    # list above.
    # left:
    #   - href: index.html
    #     text: Profile
    #   - href: research.html
    #     text: Research & Papers
    #   - href: teaching.html
    #     text: Teaching

  page-footer:
    left: "© Dr. Richa Singh · Department of Biotechnology, SIES College, Mumbai"
    right: "Built with Quarto"

  # Bonus, near-free once site-url is set: an XML sitemap for Search Console (v2 §8.3).
  # Quarto generates it automatically for a website project.

format:
  html:
    # cosmo is only the base Bootstrap; styles.scss is the actual design.
    theme: [cosmo, styles.scss]
    toc: false
    # The little paragraph anchors Quarto adds beside headings are ~15px tap
    # targets on a phone, right next to real links. Off.
    anchor-sections: false
    # 900px so the Profile page's paired columns (Appointments beside Education)
    # have room. Running text does NOT follow it out that far: styles.scss caps
    # section paragraphs at 74ch, which keeps the ~70-character measure that
    # matters most for readability.
    grid:
      body-width: 900px
    # Typefaces. Fallback stacks in styles.scss cover it if these ever fail to load.
    include-in-header:
      - text: |
          <link rel="apple-touch-icon" sizes="180x180" href="images/rs-icon-180.png">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
    # google-scholar is set PER PAPER PAGE (in each papers/*.qmd), not globally,
    # because only paper pages should emit citation meta tags. See _templates/paper-template.qmd.
